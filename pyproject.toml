[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aeo-crawl-radar"
version = "0.1.0"
description = "Self-hosted CLI that parses your web server logs and shows which AI crawlers actually visited your site."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Waseem Nasir / SkynetLabs" }]
keywords = ["aeo", "geo", "ai-crawlers", "log-analysis", "seo", "gptbot", "claudebot"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Internet :: Log Analysis",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/skynetlabs/aeo-crawl-radar"

[project.scripts]
aeo-crawl-radar = "aeo_crawl_radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aeo_crawl_radar = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
